name: Asset tool checks
on:
  push:
  pull_request:
jobs:
  check:
    # Path, link, case and process behaviour differ by platform; each one runs the whole check.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run package:cache
      - run: npm run check
